quotes:
  - text: "Imagination is more important than knowledge."
    author: "Albert Einstein"
  - text: "The only way to do great work is to love what you do."
    author: "Steve Jobs"
  - text: "If I have seen further, it is by standing on the shoulders of giants."
    author: "Isaac Newton"
  - text: "The first principle is that you must not fool yourself, and you are the easiest person to fool."
    author: "Richard Feynman"
  - text: "Give me a place to stand, and I shall move the earth."
    author: "Archimedes"
  - text: "The impediment to action advances action. What stands in the way becomes the way."
    author: "Marcus Aurelius"
  - text: "The unexamined life is not worth living."
    author: "Socrates"
  - text: "The present is theirs; the future, for which I really worked, is mine."
    author: "Nikola Tesla"
  - text: "Genius is one percent inspiration, ninety-nine percent perspiration."
    author: "Thomas Edison"
  - text: "Know the enemy and know yourself; in a hundred battles you will never be in peril."
    author: "Sun Tzu"
  - text: "Stay hungry, stay foolish."
    author: "Steve Jobs"
    