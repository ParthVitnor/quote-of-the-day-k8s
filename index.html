<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --spacing-title-date: 12px;
      --spacing-date-quote: 72px;
      --spacing-quote-author: 86px;
    }

    @media (max-width: 599px) {
      :root {
        --spacing-title-date: 16px;
        --spacing-date-quote: 40px;
        --spacing-quote-author: 48px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #F5F2ED;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      opacity: 0;
      animation: fadeIn 400ms ease forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    h1 {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #16181D;
      text-transform: uppercase;
    }

    time {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #B8B5B0;
      text-transform: uppercase;
      margin-top: var(--spacing-title-date);
    }

    blockquote {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-size: clamp(30px, 4.6vw, 54px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #16181D;
      text-wrap: balance;
      font-optical-sizing: auto;
      margin-top: var(--spacing-date-quote);
    }

    footer {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #8A8A90;
      text-transform: uppercase;
      margin-top: var(--spacing-quote-author);
    }
  </style>
</head>
<body>
  <main>
    <h1>Quote of the Day</h1>
    <time id="date" datetime=""></time>
    <blockquote id="quote"></blockquote>
    <footer id="author"></footer>
  </main>

  <script>
    // Quote data (will be replaced by backend values later)
    const quoteData = {
      text: "The only way to do great work is to love what you do.",
      author: "Steve Jobs"
    };

    // Get today's date
    const today = new Date();
    const formattedDate = today.toLocaleDateString('en-US', { 
      month: 'long', 
      day: 'numeric', 
      year: 'numeric' 
    });
    const isoDate = today.toISOString().split('T')[0];

    // Populate the DOM
    document.getElementById('date').textContent = formattedDate;
    document.getElementById('date').setAttribute('datetime', isoDate);
    document.getElementById('quote').textContent = `"${quoteData.text}"`;
    document.getElementById('author').innerHTML = `&#8212;&nbsp;&nbsp;&nbsp;&nbsp;${quoteData.author}`;
  </script>
</body>
</html>
